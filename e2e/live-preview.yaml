appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
- assertVisible:
    id: "live-scan-area"
- assertNotVisible: "Ready to Scan"
- startRecording: live-preview
- assertNotVisible: "Point the camera at a QR code. Scanning starts automatically."
- tapOn: "History"
- assertVisible: "Your scan history will appear here."
- tapOn: "Scanner"
- assertVisible:
    id: "live-scan-area"
- assertNotVisible: "Ready to Scan"
- stopRecording
