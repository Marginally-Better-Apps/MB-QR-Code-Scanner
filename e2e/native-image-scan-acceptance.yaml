appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      nativeImageFixture: "damaged-distant-qr"
- assertVisible: ".*example.com/native-image-fixture.*"
- startRecording: native-image-scan-acceptance
- tapOn: ".*example.com/native-image-fixture.*"
- assertVisible: "Copy"
- tapOn: "Copy"
- assertNotVisible: "Ready to Scan"
- stopRecording
