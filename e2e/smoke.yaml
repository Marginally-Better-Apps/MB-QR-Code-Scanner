appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
- assertVisible:
    id: "open-history"
- assertVisible: "Camera Unavailable"
- startRecording: smoke
- tapOn:
    id: "open-history"
- assertVisible: "Your scan history will appear here."
- tapOn:
    id: "history-back"
- assertVisible: "Camera Unavailable"
- stopRecording
