appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
- assertVisible:
    id: "open-history"
- assertVisible: "Camera Unavailable"
- startRecording: smoke
- tapOn:
    id: "open-history"
- assertVisible: "Accepted scans appear here."
- assertVisible: "Scan a QR code"
- tapOn:
    id: "history-back"
- assertVisible: "Camera Unavailable"
- stopRecording
