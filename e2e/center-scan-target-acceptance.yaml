appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      nativeImageFixture: "damaged-distant-qr"
- assertVisible: "https://example.com/native-image-fixture"
- assertVisible:
    id: "center-scan-guide"
- assertVisible:
    id: "scanner-observation-bounds"
- startRecording: center-scan-target-acceptance
- assertVisible: "Copy"
- assertNotVisible: "Ready to Scan"
- stopRecording
