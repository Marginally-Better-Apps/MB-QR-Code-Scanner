appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      scannerFixture: "acceptance-first"
- assertVisible:
    id: "sticky-result-accessory"
- assertVisible: "https://example.com/acceptance-first"
- startRecording: acceptance-journey
- tapOn:
    id: "fixture-clear"
- assertVisible:
    id: "sticky-result-accessory"
- assertVisible: "https://example.com/acceptance-first"
- tapOn:
    id: "fixture-inject-second"
- assertVisible: "https://example.com/acceptance-second"
- assertVisible:
    id: "sticky-result-accessory"
- tapOn:
    id: "open-history"
- assertVisible: "example.com/acceptance-first.*"
- assertVisible: "example.com/acceptance-second.*"
- tapOn: "example.com/acceptance-first.*"
- assertVisible:
    id: "history-detail"
- assertVisible:
    id: "sticky-result-open"
- tapOn:
    id: "history-back"
- assertVisible: "example.com/acceptance-second.*"
- swipe:
    from:
      text: "example.com/acceptance-second.*"
    direction: LEFT
    duration: 600
- tapOn:
    id: "history-row-delete"
    optional: true
- tapOn:
    text: "Delete"
    optional: true
- tapOn:
    id: "history-row-swipe-full"
    optional: true
- assertVisible:
    id: "history-undo"
- assertNotVisible: "example.com/acceptance-second.*"
- stopRecording
