appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "recovering"
- assertVisible: "Camera Access Is Off"
- assertVisible: "Open Settings"
- startRecording: camera-permission-acceptance
- tapOn: "Open Settings"
- launchApp:
    stopApp: false
- assertVisible:
    id: "live-scan-area"
- assertNotVisible: "Ready to Scan"
- stopRecording
