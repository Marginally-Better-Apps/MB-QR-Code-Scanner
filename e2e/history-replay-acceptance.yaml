appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      historyFixture: "grouped"
- tapOn:
    id: "open-history"
- assertVisible: "example.com/today.*"
- tapOn:
    id: "history-back"
- assertVisible:
    id: "open-history"
- startRecording: history-replay-acceptance
- launchApp:
    clearState: false
    arguments:
      cameraFixture: "authorized"
- tapOn:
    id: "open-history"
- assertVisible: "Today"
- tapOn: "example.com/today.*"
- assertVisible:
    id: "sticky-result-accessory"
- assertVisible:
    id: "sticky-result-copy"
- assertVisible:
    id: "sticky-result-share"
- assertVisible:
    id: "sticky-result-open"
- tapOn:
    id: "history-back"
- tapOn: "Sensitive scan.*"
- assertVisible: "This sensitive code was not saved."
- assertNotVisible:
    id: "sticky-result-copy"
- stopRecording
