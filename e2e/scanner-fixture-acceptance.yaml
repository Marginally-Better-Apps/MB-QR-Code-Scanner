appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      scannerFixture: "single-code"
- assertVisible: "https://example.com/fixture"
- assertVisible: "Copy"
- assertVisible:
    id: "scanner-observation-bounds"
- assertNotVisible: "Ready to Scan"
- startRecording: scanner-fixture-acceptance
- tapOn:
    id: "open-history"
- assertVisible: "Your scan history will appear here."
- tapOn:
    id: "history-back"
- assertVisible: "https://example.com/fixture"
- assertVisible: "Copy"
- assertVisible:
    id: "scanner-observation-bounds"
- assertNotVisible: "Ready to Scan"
- stopRecording
