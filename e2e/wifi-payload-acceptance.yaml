appId: com.marginallybetter.qrscanner
---
- launchApp:
    clearState: true
    arguments:
      cameraFixture: "authorized"
      scannerFixture: "wifi-code"
- assertVisible: "HomeNet"
- assertVisible: "WPA"
- assertNotVisible: "supersecret"
- startRecording: wifi-payload-acceptance
- assertVisible: "Joining Wi-Fi is not available on this build."
- stopRecording
