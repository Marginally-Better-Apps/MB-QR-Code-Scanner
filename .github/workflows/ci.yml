name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'story/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native tests and iOS build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app /Applications/Xcode_27*.app)
          test ${#candidates[@]} -gt 0
          XCODE_APP="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
      - name: Test Swift parser, History migration, and scan lifecycle
        run: swift test
      - name: Test native image decoding and preview geometry
        run: ./scripts/test-native-qr-decoder.sh
      - name: Test release tooling
        run: |
          python3 scripts/test-semantic-version.py
          python3 scripts/test-select-simulator.py
          python3 scripts/test-write-autoloader-page.py
          python3 scripts/test-ci-workflows.py
      - name: Build standalone iOS app
        run: |
          xcodebuild build -project native/QRScanner.xcodeproj -scheme QRScanner \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/CI CODE_SIGNING_ALLOWED=NO
          python3 scripts/test-built-app.py DerivedData/CI/Build/Products/Release-iphonesimulator/QRScanner.app
      - name: Set up Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify native multi-code panel and repeat swipe-delete
        run: |
          DEVICE_ID="$(./scripts/select-simulator.py iPhone)"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" DerivedData/CI/Build/Products/Release-iphonesimulator/QRScanner.app
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/native-image-scan-acceptance.yaml
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/native-ui-acceptance.yaml
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-evidence
          path: artifacts/native-ui
          if-no-files-found: ignore
