name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Release policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test semantic versioning
        run: python3 scripts/test-semantic-version.py
      - name: Test simulator selection
        run: python3 scripts/test-select-simulator.py
      - name: Test CI workflow safeguards
        run: python3 scripts/test-ci-workflows.py

  ios:
    name: Swift tests (iPhone Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint Xcode toolchain
        id: xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "cache-key=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Select and boot simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(./scripts/select-simulator.py iPhone)"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true

      - name: Cache test build
        id: test-build-cache
        uses: actions/cache@v4
        with:
          path: DerivedData/CI
          key: ios-ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('QRScanner.xcodeproj/**', 'QRScanner/**/*.swift', 'QRScanner/**/*.xcassets/**', 'QRScannerTests/**/*.swift') }}
          restore-keys: |
            ios-ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-

      - name: Build tests on cold cache
        if: steps.test-build-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData/CI \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run tests without rebuilding
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${{ steps.simulator.outputs.id }}" -b
          xcodebuild test-without-building \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath DerivedData/CI \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify universal iOS device family
        run: |
          set -euo pipefail
          FAMILY="$(xcodebuild -project QRScanner.xcodeproj -scheme QRScanner -showBuildSettings | awk -F ' = ' '/TARGETED_DEVICE_FAMILY/{print $2; exit}')"
          test "$FAMILY" = "1,2"
