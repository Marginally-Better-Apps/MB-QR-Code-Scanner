name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'story/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: Release tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test versioning, simulator selection, and Autoloader page
        run: |
          python3 scripts/test-semantic-version.py
          python3 scripts/test-select-simulator.py
          python3 scripts/test-write-autoloader-page.py

  native:
    name: Native tests and iOS build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26+
        id: xcode
        uses: ./.github/actions/select-xcode
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-
      - name: Test Swift parser, History migration, and scan lifecycle
        run: swift test
      - name: Test native image decoding and preview geometry
        run: ./scripts/test-native-qr-decoder.sh
      - name: Build standalone iOS app
        run: |
          xcodebuild build -project native/QRScanner.xcodeproj -scheme QRScanner \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/CI CODE_SIGNING_ALLOWED=NO
          python3 scripts/test-built-app.py DerivedData/CI/Build/Products/Release-iphonesimulator/QRScanner.app
      - name: Set up Java for Maestro
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-maestro.sh') }}
      - name: Install Maestro
        run: |
          ./scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Verify native multi-code panel, repeat swipe-delete, and acceptance journey
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          DEVICE_ID="$(./scripts/select-simulator.py iPhone)"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          ./scripts/test-native-qr-decoder.sh "$DEVICE_ID"
          xcrun simctl install "$DEVICE_ID" DerivedData/CI/Build/Products/Release-iphonesimulator/QRScanner.app
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/native-image-scan-acceptance.yaml
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/native-ui-acceptance.yaml
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/acceptance-journey.yaml
          xcrun simctl addmedia "$DEVICE_ID" native/QRScanner/Fixtures/normal-qr.png
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/photo-import-acceptance.yaml
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/scan-location-acceptance.yaml
          maestro test --device "$DEVICE_ID" --test-output-dir artifacts/native-ui e2e/full-scan-data-acceptance.yaml
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ui-evidence
          path: artifacts/native-ui
          if-no-files-found: ignore
