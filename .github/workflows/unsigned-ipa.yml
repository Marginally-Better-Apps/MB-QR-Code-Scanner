name: PR unsigned IPA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select iOS 26 SDK Xcode
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app /Applications/Xcode_27*.app)
          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "error: no Xcode 26+ install found" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          XCODE_APP="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fingerprint Xcode toolchain
        id: xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "cache-key=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData/Archive
          key: ios-archive-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('QRScanner.xcodeproj/**', 'QRScanner/**/*.swift', 'QRScanner/**/*.xcassets/**') }}
          restore-keys: |
            ios-archive-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache-key }}-

      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project QRScanner.xcodeproj \
            -scheme QRScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/QRScanner.xcarchive" \
            -derivedDataPath "$PWD/DerivedData/Archive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package IPA
        run: ./scripts/package-ipa.sh build/QRScanner.xcarchive artifacts/QR-Scanner-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: QR-Scanner-PR-${{ github.event.pull_request.number || github.run_number }}-unsigned
          path: artifacts/QR-Scanner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
