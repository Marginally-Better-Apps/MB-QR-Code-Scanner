name: PR unsigned IPA

on:
  pull_request:
    branches: [main, 'story/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    # Draft PRs skip the archive; marking the PR ready for review triggers it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26+
        id: xcode
        uses: ./.github/actions/select-xcode

      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/Archive
          key: ios-native-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Sources/**', 'native/**', 'Package.swift') }}
          restore-keys: |
            ios-native-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-

      - name: Archive without signing
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/archive-unsigned.sh --build-number "$BUILD_NUMBER" build/QRScanner.xcarchive DerivedData/Archive

      - name: Package IPA
        run: |
          set -euo pipefail
          ./scripts/package-ipa.sh build/QRScanner.xcarchive artifacts/QR-Scanner-unsigned.ipa
          ./scripts/assert-native-ipa.sh artifacts/QR-Scanner-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QR-Scanner-PR-${{ github.event.pull_request.number || github.run_number }}-unsigned
          path: artifacts/QR-Scanner-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Autoloader preview
    needs: build
    # Fork PRs cannot publish with GITHUB_TOKEN.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The Pages deploy needs a git checkout; nothing from the PR is executed with this token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download unsigned IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QR-Scanner-PR-${{ github.event.pull_request.number }}-unsigned
          path: artifacts

      # Written here from the base branch's script, so no PR-built HTML is deployed with the write token.
      - name: Write Autoloader page
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          IPA_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/pr-${PR_NUMBER}/QR-Scanner-unsigned.ipa"
          python3 scripts/write-autoloader-page.py \
            --ipa-url "${IPA_URL}" \
            --output autoloader-page/index.html \
            --title "QR Scanner"

      - name: Publish prerelease
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="pr-${PR_NUMBER}"
          IPA_NAME="QR-Scanner-unsigned.ipa"
          IPA_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          OWNER_HOST="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER_HOST}.github.io/${REPO_NAME}/pr/${PR_NUMBER}/"
          test -s "artifacts/${IPA_NAME}"

          gh release delete "${TAG}" --yes --cleanup-tag || true
          gh release create "${TAG}" "artifacts/${IPA_NAME}" \
            --prerelease \
            --latest=false \
            --target "${HEAD_SHA}" \
            --title "PR #${PR_NUMBER} unsigned IPA" \
            --notes "Autoloader preview for ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

          echo "ipa-url=${IPA_URL}" >> "${GITHUB_OUTPUT}"
          echo "pages-url=${PAGES_URL}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Pages trampoline
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: autoloader-page
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: false
          branch: gh-pages
          commit-message: "preview: Autoloader trampoline for PR ${{ github.event.pull_request.number }}"

      - name: Enable GitHub Pages if needed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 || \
            echo '{"source":{"branch":"gh-pages","path":"/"}}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null

      - name: Update PR preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_URL: ${{ steps.preview.outputs.pages-url }}
          IPA_URL: ${{ steps.preview.outputs.ipa-url }}
        with:
          script: |
            const marker = '<!-- autoloader-pr-preview -->';
            const body = `${marker}
            ## Install on a phone

            [Open in Autoloader](${process.env.PAGES_URL})

            GitHub will not make \`autoloader://\` tappable, so that link is HTTPS and bounces into Autoloader. If you are in the GitHub app and nothing happens, open the page in Safari.

            The unsigned IPA is also at [the PR preview release](${process.env.IPA_URL}). Sign it with your own certificate. Autoloader does that for you after the first setup.

            _Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body.includes(marker)
            );
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };
            if (previous) {
              await github.rest.issues.updateComment({ ...params, comment_id: previous.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
