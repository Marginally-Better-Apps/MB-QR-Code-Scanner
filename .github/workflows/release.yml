name: Tagless release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tagless-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build semantic unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          KIND="$(./scripts/semantic-version.py --kind HEAD)"
          VERSION="$(./scripts/semantic-version.py HEAD)"

          if [[ "$EVENT_NAME" = "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "kind=manual" >> "$GITHUB_OUTPUT"
          elif [[ "$KIND" != "none" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Explain non-release commit
        if: steps.release.outputs.build != 'true'
        run: echo "The main commit is not fix:, feat:, or feat!:; no release artifact will be built."

      - name: Select Xcode 26+
        if: steps.release.outputs.build == 'true'
        uses: ./.github/actions/select-xcode

      # Releases archive from a clean DerivedData; no build cache is restored.
      - name: Archive without signing
        if: steps.release.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/archive-unsigned.sh --version "$VERSION" --build-number "$BUILD_NUMBER" \
            build/QRScanner.xcarchive DerivedData/Release

      - name: Package IPA
        if: steps.release.outputs.build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/package-ipa.sh build/QRScanner.xcarchive "artifacts/QR-Scanner-v${VERSION}-unsigned.ipa"
          ./scripts/assert-native-ipa.sh "artifacts/QR-Scanner-v${VERSION}-unsigned.ipa"

      - name: Upload tagless release artifact
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QR-Scanner-v${{ steps.release.outputs.version }}-unsigned
          path: artifacts/QR-Scanner-v${{ steps.release.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
